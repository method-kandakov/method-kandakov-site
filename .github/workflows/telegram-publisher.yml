name: Telegram Publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Action
        required: true
        type: choice
        options:
          - setup
          - publish
      payload:
        description: Encrypted publication payload
        required: false
        type: string
  schedule:
    # GitHub cron uses UTC. Moscow is UTC+3 year-round.
    - cron: '0 9 * * 1,4'   # Public: Monday and Thursday, 12:00 Moscow
    - cron: '0 16 * * 2,6'  # CLUB: Tuesday and Saturday, 19:00 Moscow

permissions:
  contents: write

concurrency:
  group: telegram-publisher
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect CLUB securely
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'setup'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DECRYPT_KEY: ${{ secrets.TELEGRAM_DECRYPT_KEY }}
        run: |
          node telegram/publisher.mjs setup
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/club-chat.enc
          git diff --cached --quiet || git commit -m "Connect Telegram CLUB channel"
          git push

      - name: Publish encrypted message manually
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DECRYPT_KEY: ${{ secrets.TELEGRAM_DECRYPT_KEY }}
          TELEGRAM_PAYLOAD: ${{ inputs.payload }}
        run: node telegram/publisher.mjs publish

      - name: Publish next scheduled message
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DECRYPT_KEY: ${{ secrets.TELEGRAM_DECRYPT_KEY }}
          TELEGRAM_CHANNEL: ${{ github.event.schedule == '0 16 * * 2,6' && 'club' || 'main' }}
        run: |
          node telegram/publisher.mjs scheduled
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/queue.json
          git diff --cached --quiet || git commit -m "Advance Telegram publication queue"
          git push
